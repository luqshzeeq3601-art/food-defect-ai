version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: food-defect-aoi-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
    environment:
      - ENVIRONMENT=production
      - APP_VERSION=0.2.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8501
      - DEFAULT_ONNX_MODEL=/app/models/onnx/best_s.onnx
      - QUANTIZED_ONNX_MODEL=/app/models/onnx/best_s_int8.onnx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: food-defect-aoi-dashboard
    command: streamlit run src/ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
    restart: unless-stopped
